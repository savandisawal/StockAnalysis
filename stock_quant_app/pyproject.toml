[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "data*", "features*", "model*", "services*", "utils*", "ui_streamlit*"]

[project]
name = "stock-quant-app"
version = "0.1.0"
description = "Production-grade NSE India next-day price range prediction system"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",

    # Frontend
    "streamlit>=1.40.0",
    "plotly>=5.24.0",

    # ML
    "lightgbm>=4.5.0",
    "scikit-learn>=1.5.0",
    "shap>=0.46.0",

    # Data & indicators
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pandas_ta>=0.3.14b1",
    "yfinance>=0.2.46",

    # Scraping & parsing
    "beautifulsoup4>=4.12.0",
    "feedparser>=6.0.0",
    "lxml>=5.3.0",

    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",

    # Config & logging
    "pydantic-settings>=2.6.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",

    # Scheduling
    "apscheduler>=3.10.0",

    # Market calendar
    "exchange-calendars>=4.5.0",

    # Claude API (sentiment scoring)
    "anthropic>=0.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Streamlit pages need sys.path + set_page_config before imports, and have inline CSS
"ui_streamlit/**/*.py" = ["E402", "E501", "F401", "I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: marks tests that hit external APIs (deselect with '-m \"not slow\"')",
]
